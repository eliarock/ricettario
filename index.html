<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ricettario personale</title>
<style>
  :root { color-scheme: light; --ink:#28271f; --muted:#5f594d; --paper:#f7f3e9; --rule:#d6cbb7; --accent:#85412d; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--paper); color:var(--ink); font:1rem/1.55 system-ui,sans-serif; }
  main { max-width:60rem; margin:auto; padding:clamp(1.2rem,5vw,4rem); }
  .mast { display:flex; justify-content:space-between; gap:1rem; border-bottom:1px solid var(--rule); padding-bottom:1rem; color:var(--muted); font-size:.82rem; }
  .mast strong { color:var(--accent); text-transform:uppercase; letter-spacing:.12em; }
  h1,h2,h3 { font-family:Georgia,serif; font-weight:normal; line-height:1.12; margin:0; }
  h1 { font-size:clamp(2.8rem,8vw,5rem); margin-top:2.4rem; letter-spacing:-.04em; }
  h2 { font-size:clamp(2rem,5vw,3.1rem); }
  h3 { font-size:1.45rem; }
  .intro { color:var(--muted); margin:.55rem 0 1.55rem; }
  label { display:block; margin-bottom:.4rem; font-weight:650; }
  .entry { display:flex; gap:.55rem; }
  input,button { font:inherit; border-radius:.28rem; padding:.78rem 1rem; }
  input { min-width:0; flex:1; border:1px solid #a99a83; background:#fffefa; color:var(--ink); }
  button { background:var(--accent); color:#fff; border:1px solid transparent; font-weight:650; cursor:pointer; }
  button:hover, .access:hover { background:#6a3424; }
  .access { display:inline-block; background:var(--accent); color:white; border-radius:.28rem; padding:.78rem 1rem; text-decoration:none; font-weight:650; }
  button:disabled { opacity:.65; cursor:not-allowed; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  #status { min-height:1.6rem; color:var(--muted); }
  article { margin-top:1.5rem; background:#fffefa; padding:clamp(1.2rem,4vw,2.5rem); border:1px solid var(--rule); }
  .recipe-head { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:start; gap:1rem; }
  .recipe-head img { width:clamp(6rem,20vw,12rem); aspect-ratio:4/3; object-fit:cover; }
  .recipe-head img[hidden] { display:none; }
  #meta,#sources { color:var(--muted); font-size:.9rem; }
  #notice { border-left:3px solid var(--accent); padding-left:.75rem; color:#693624; }
  .columns { display:grid; grid-template-columns:1fr 1.6fr; gap:1.6rem; margin-top:1.5rem; }
  ul,ol { padding-left:1.3rem; }
  li { padding-left:.15rem; margin:.35rem 0; }
  #caption { white-space:pre-line; overflow-wrap:anywhere; }
  #sources { border-top:1px solid var(--rule); padding-top:.75rem; }
  a { color:var(--accent); text-underline-offset:.2em; }
  @media (max-width:34rem) { .entry,.columns { display:grid; grid-template-columns:1fr; } }
  @page { size:A4 portrait; margin:13mm; }
  @media print {
    body,article { background:white; color:#111; }
    main,article { margin:0; padding:0; max-width:none; border:0; }
    .screen { display:none !important; }
    .recipe-head { grid-template-columns:minmax(0,1fr) auto; break-inside:avoid; }
    .recipe-head img { width:42mm; max-height:31mm; }
    h2 { font-size:25pt; } h3 { font-size:15pt; break-after:avoid; }
    .columns { display:grid; grid-template-columns:1fr 1.6fr; gap:8mm; margin-top:4mm; }
    body,#meta,#sources { font-size:10pt; }
    li { break-inside:avoid; }
  }

  :root { --paper:#f5f0e7; --ink:#292b22; --muted:#5c5b4d; --accent:#873e2a; --rule:#d7cebd; --green:#29382d; }
  main { max-width:72rem; padding-top:1.5rem; }
  .mast { align-items:center; margin-bottom:1.1rem; border:0; padding:0; }
  .mast strong { font-family:Georgia,serif; font-size:1.45rem; text-transform:none; letter-spacing:0; }
  .mast span,.eyebrow { font-size:.75rem; font-weight:750; text-transform:uppercase; letter-spacing:.13em; }
  .import-panel { position:relative; isolation:isolate; overflow:hidden; background:var(--green); color:#fff8e9; padding:clamp(1.4rem,4vw,3rem); border-radius:.7rem; }
  .import-panel::after { content:""; position:absolute; z-index:-1; width:20rem; aspect-ratio:1; top:-9rem; right:-4rem; border-radius:50%; background:repeating-radial-gradient(circle,transparent 0 16px,#f4ddad30 17px 18px,transparent 19px 25px); pointer-events:none; }
  .import-panel h1 { font-size:clamp(2.4rem,6vw,4.5rem); margin:.35rem 0; }
  .import-panel .eyebrow,.import-panel .intro,.import-panel #status { color:#e9ddc6; }
  .import-panel .intro { margin-bottom:1.35rem; }
  .import-panel label { font-size:.88rem; }
  .import-panel .entry { max-width:45rem; }
  .import-panel :focus-visible { outline-color:#ffdb9b; }
  #status { margin:.75rem 0 0; min-height:0; }
  #status:empty,#meta:empty { display:none; }
  .archive { margin-top:clamp(2rem,5vw,3.6rem); }
  .archive-head { display:flex; gap:1rem; justify-content:space-between; align-items:end; padding-bottom:.95rem; border-bottom:1px solid var(--rule); }
  .archive-head h2 { font-size:clamp(2.1rem,5vw,3.4rem); }
  #count { color:var(--muted); margin:.3rem 0 0; }
  .search { min-width:0; width:min(18rem,100%); }
  .search input { width:100%; padding:.6rem .75rem; }
  .archive-empty { padding:1.5rem 0; color:var(--muted); }
  .archive-list { list-style:none; margin:0; padding:0; }
  .archive-item { display:flex; align-items:center; gap:.85rem; margin:0; padding:.8rem 0; border-bottom:1px solid var(--rule); }
  .archive-open { display:flex; gap:1rem; align-items:center; flex:1; min-width:0; text-align:left; padding:.25rem; color:var(--ink); background:transparent; }
  .archive-open:hover,.quiet:hover { background:#e9e0cf; }
  .thumb { width:4.7rem; height:3.7rem; flex:none; display:grid; place-items:center; background:#e9dfca; color:#78533c; border-radius:.3rem; overflow:hidden; font:1.35rem Georgia,serif; }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .entry-title { display:block; font:1.25rem/1.2 Georgia,serif; overflow-wrap:anywhere; }
  .entry-source { display:block; margin-top:.22rem; font-size:.8rem; color:var(--muted); }
  .quiet { background:transparent; border-color:#ad9e87; color:var(--ink); }
  .remove { font-size:.85rem; padding:.45rem .6rem; }
  #archive-note { color:var(--muted); font-size:.85rem; margin-top:1.1rem; }
  article { border-radius:.55rem; box-shadow:0 8px 22px #34271210; }
  .recipe-actions { display:flex; align-items:center; gap:.55rem; flex-wrap:wrap; }
  #recipe-feedback { margin:.55rem 0 0; color:var(--muted); }
  @media (max-width:34rem) {
    .archive-head { align-items:stretch; flex-direction:column; }
    .search { width:100%; }
    .archive-item { gap:.45rem; }
    .archive-open { gap:.55rem; }
    .thumb { width:3.5rem; height:3rem; }
    .remove { padding:.4rem; }
    .mast span { font-size:.65rem; }
  }
  @media print { main,article { padding:0; box-shadow:none; border-radius:0; } }
</style>
</head>
<body>
<main>
  <header class="mast screen"><strong>Ricettario</strong><span>Archivio personale</span></header>
  <section class="screen import-panel" aria-labelledby="import-title">
    <div class="eyebrow">Nuova ricetta</div>
    <h1 id="import-title">Dal link alla tavola.</h1>
    <p id="intro" class="intro">Incolla il link di un Reel o di un blog di cucina.</p>
    <form id="form">
      <label for="url">Link della ricetta</label>
      <div class="entry"><input id="url" type="url" placeholder="https://…" autocomplete="url" required><button id="import">Importa ricetta</button></div>
    </form>
    <a id="access" class="access" href="https://ricettario-elia.onrender.com/" hidden>Accedi al ricettario</a>
    <p id="status" role="status"></p>
  </section>
  <article id="recipe" hidden aria-labelledby="title">
    <header class="recipe-head">
      <div><h2 id="title" tabindex="-1"></h2><p id="meta"></p></div>
      <img id="photo" alt="" hidden>
    </header>
    <p id="notice" hidden></p>
    <div class="columns" id="columns">
      <section><h3>Ingredienti</h3><ul id="ingredients"></ul></section>
      <section><h3>Procedimento</h3><ol id="steps"></ol></section>
    </div>
    <p id="caption" hidden></p>
    <p id="sources"></p>
    <div class="screen recipe-actions">
      <button type="button" id="save">Salva ricetta</button>
      <button class="quiet" type="button" id="print">Stampa ricetta</button>
      <button class="quiet" type="button" id="close">Chiudi scheda</button>
    </div>
    <p class="screen" id="recipe-feedback" role="status"></p>
  </article>
  <section id="archive" class="screen archive" aria-labelledby="archive-title" hidden>
    <header class="archive-head">
      <div><h2 id="archive-title" tabindex="-1">Le mie ricette</h2><p id="count"></p></div>
      <div class="search" id="search-wrap" hidden><label for="search">Cerca nell’archivio</label><input type="search" id="search" placeholder="Titolo, autore, ingrediente…"></div>
    </header>
    <p class="archive-empty" id="archive-empty"></p>
    <ul class="archive-list" id="archive-list"></ul>
    <p id="archive-note">Le ricette sono salvate in questo browser.</p>
  </section>
</main>
<script>
  const byId = id => document.getElementById(id);
  const form = byId('form');
  const status = byId('status');
  const article = byId('recipe');
  const button = byId('import');
  const setList = (id, values) => {
    byId(id).replaceChildren(...(Array.isArray(values) ? values : []).map(value => {
      const li = document.createElement('li');
      li.textContent = String(value);
      return li;
    }));
  };
  const storageKey = 'ricettario.archive.v1';
  let current;
  let returnFocus;
  const feedback = byId('recipe-feedback');
  const saveButton = byId('save');
  const search = byId('search');
  const https = value => typeof value === 'string' && value.startsWith('https://');

  function readArchive() {
    const data = JSON.parse(localStorage.getItem(storageKey) || '[]');
    if (!Array.isArray(data)) throw new Error('Archivio illeggibile');
    return data;
  }

  function renderArchive() {
    const list = byId('archive-list');
    const empty = byId('archive-empty');
    const count = byId('count');
    list.replaceChildren();
    let entries;
    try {
      entries = readArchive();
    } catch {
      empty.hidden = false;
      empty.textContent = 'L’archivio di questo browser non è disponibile.';
      saveButton.disabled = true;
      return;
    }
    saveButton.disabled = false;
    count.textContent = entries.length === 1 ? '1 ricetta salvata' : entries.length + ' ricette salvate';
    byId('search-wrap').hidden = !entries.length;
    if (!entries.length) search.value = '';
    const query = search.value.trim().toLocaleLowerCase('it');
    const filtered = entries.filter(({recipe}) => [recipe.titolo, recipe.author, recipe.descrizione,
      ...(Array.isArray(recipe.ingredienti) ? recipe.ingredienti : [])]
      .some(value => String(value || '').toLocaleLowerCase('it').includes(query)));
    empty.hidden = !!filtered.length;
    empty.textContent = entries.length
      ? 'Nessuna ricetta corrisponde alla ricerca.'
      : 'Il tuo archivio è ancora vuoto. Importa un link e premi «Salva ricetta».';
    for (const entry of filtered) {
      const {recipe, key} = entry;
      const title = recipe.titolo || 'Ricetta senza titolo';
      const row = document.createElement('li');
      row.className = 'archive-item';
      const open = document.createElement('button');
      open.type = 'button';
      open.className = 'archive-open';
      const thumb = document.createElement('span');
      thumb.className = 'thumb';
      thumb.setAttribute('aria-hidden', 'true');
      thumb.textContent = title.slice(0, 1).toLocaleUpperCase('it');
      if (https(recipe.image)) {
        const image = document.createElement('img');
        image.alt = '';
        image.loading = 'lazy';
        image.addEventListener('error', () => { thumb.textContent = title.slice(0, 1); });
        image.src = recipe.image;
        thumb.replaceChildren(image);
      }
      const info = document.createElement('span');
      const label = document.createElement('span');
      label.className = 'entry-title';
      label.textContent = title;
      const source = document.createElement('span');
      source.className = 'entry-source';
      source.textContent = recipe.author || (recipe.blog ? 'Blog di cucina' : 'Reel');
      info.append(label, source);
      open.append(thumb, info);
      open.addEventListener('click', () => render(recipe, key, open, true));
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'quiet remove';
      remove.textContent = 'Rimuovi';
      remove.setAttribute('aria-label', 'Rimuovi ' + title);
      remove.addEventListener('click', () => {
        if (!window.confirm('Rimuovere «' + title + '» dall’archivio?')) return;
        try {
          localStorage.setItem(storageKey, JSON.stringify(readArchive().filter(item => item.key !== key)));
          if (current?.key === key) closeRecipe(false);
          renderArchive();
          byId('archive-title').focus();
        } catch {
          byId('archive-note').textContent = 'Non è stato possibile rimuovere la ricetta.';
        }
      });
      row.append(open, remove);
      list.append(row);
    }
  }

  function closeRecipe(restoreFocus = true) {
    article.hidden = true;
    current = undefined;
    if (restoreFocus) {
      (returnFocus?.isConnected ? returnFocus : byId('url')).focus();
    }
  }

  function render(recipe, key, trigger, saved = false) {
    current = {recipe, key};
    returnFocus = trigger;
    feedback.textContent = '';
    saveButton.hidden = saved;
    byId('title').textContent = recipe.titolo || 'Ricetta importata';
    byId('meta').textContent = [recipe.author, recipe.porzioni && recipe.porzioni + ' porzioni',
      ...(typeof recipe.tempi === 'string' ? [recipe.tempi] :
        Object.entries(recipe.tempi || {}).filter(([, value]) => value).map(([key, value]) => key + ' · ' + value))
    ].filter(Boolean).join('  /  ');
    const photo = byId('photo');
    photo.hidden = !recipe.image;
    photo.removeAttribute('src');
    if (https(recipe.image)) photo.src = recipe.image;
    else photo.hidden = true;
    const notes = [
      recipe.needs_confirmation && 'Ricetta trovata sul blog dell’autore. Verifica che corrisponda al Reel.',
      !recipe.translated && 'Anteprima nella lingua originale. Traduzione da configurare.',
    ].filter(Boolean);
    byId('notice').textContent = notes.join(' ');
    byId('notice').hidden = !notes.length;
    byId('caption').textContent = recipe.descrizione || '';
    byId('caption').hidden = !recipe.descrizione;
    byId('columns').hidden = Boolean(recipe.descrizione);
    setList('ingredients', recipe.ingredienti);
    setList('steps', recipe.passaggi);
    const sources = byId('sources');
    sources.replaceChildren('Fonti ');
    for (const [label, url] of [['Reel', recipe.reel], ['Blog', recipe.blog]]) {
      if (typeof url !== 'string' || !url.startsWith('https://')) continue;
      const a = document.createElement('a');
      a.href = url;
      a.textContent = label;
      sources.append('  ', a);
    }
    article.hidden = false;
    byId('title').focus();
  }
  const pagesPreview = window.location.hostname.endsWith('.github.io');
  if (pagesPreview) {
    form.hidden = true;
    byId('access').hidden = false;
    byId('intro').textContent = 'Accedi per importare una ricetta da un Reel o da un blog di cucina.';
  } else {
    byId('archive').hidden = false;
    renderArchive();
    search.addEventListener('input', renderArchive);
    window.addEventListener('storage', event => {
      if (event.key === storageKey || event.key === null) renderArchive();
    });
  }
  saveButton.addEventListener('click', () => {
    if (!current) return;
    try {
      const remaining = readArchive().filter(item => item.key !== current.key);
      localStorage.setItem(storageKey, JSON.stringify([current, ...remaining]));
      renderArchive();
      saveButton.hidden = true;
      feedback.textContent = 'Salvata nelle mie ricette.';
      byId('print').focus();
    } catch {
      feedback.textContent = 'Impossibile salvare in questo browser. Controlla lo spazio disponibile.';
    }
  });
  byId('close').addEventListener('click', () => closeRecipe());
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (pagesPreview) return;
    button.disabled = true;
    status.textContent = 'Sto cercando la ricetta…';
    closeRecipe(false);
    const url = byId('url').value.trim();
    try {
      const response = await fetch('/api/import', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({url}),
      });
      if (!response.headers.get('Content-Type')?.includes('application/json')) {
        throw new Error('Il servizio di importazione non risponde. Riprova più tardi.');
      }
      const recipe = await response.json();
      if (!response.ok) throw new Error(recipe.error);
      render(recipe, recipe.reel || recipe.blog || url, byId('url'));
      status.textContent = 'Ricetta importata.';
    } catch (error) {
      status.textContent = error instanceof SyntaxError || error instanceof TypeError
        ? 'Il servizio di importazione non è disponibile. Riprova tra poco.'
        : error.message;
    } finally {
      button.disabled = false;
    }
  });
  byId('photo').addEventListener('error', event => { event.target.hidden = true; });
  byId('print').addEventListener('click', () => window.print());
</script>
</body>
</html>
