<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ricettario personale</title>
<style>
  :root { color-scheme: light; --ink:#28271f; --muted:#5f594d; --paper:#f7f3e9; --rule:#d6cbb7; --accent:#85412d; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--paper); color:var(--ink); font:1rem/1.55 system-ui,sans-serif; }
  main { max-width:60rem; margin:auto; padding:clamp(1.2rem,5vw,4rem); }
  .mast { display:flex; justify-content:space-between; gap:1rem; border-bottom:1px solid var(--rule); padding-bottom:1rem; color:var(--muted); font-size:.82rem; }
  .mast strong { color:var(--accent); text-transform:uppercase; letter-spacing:.12em; }
  h1,h2,h3 { font-family:Georgia,serif; font-weight:normal; line-height:1.12; margin:0; }
  h1 { font-size:clamp(2.8rem,8vw,5rem); margin-top:2.4rem; letter-spacing:-.04em; }
  h2 { font-size:clamp(2rem,5vw,3.1rem); }
  h3 { font-size:1.45rem; }
  .intro { color:var(--muted); margin:.55rem 0 1.55rem; }
  label { display:block; margin-bottom:.4rem; font-weight:650; }
  .entry { display:flex; gap:.55rem; }
  input,button { font:inherit; border-radius:.28rem; padding:.78rem 1rem; }
  input { min-width:0; flex:1; border:1px solid #a99a83; background:#fffefa; color:var(--ink); }
  button { background:var(--accent); color:#fff; border:1px solid transparent; font-weight:650; cursor:pointer; }
  button:hover, .access:hover { background:#6a3424; }
  .access { display:inline-block; background:var(--accent); color:white; border-radius:.28rem; padding:.78rem 1rem; text-decoration:none; font-weight:650; }
  button:disabled { opacity:.65; cursor:not-allowed; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  #status { min-height:1.6rem; color:var(--muted); }
  article { margin-top:1.5rem; background:#fffefa; padding:clamp(1.2rem,4vw,2.5rem); border:1px solid var(--rule); }
  .recipe-head { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:start; gap:1rem; }
  .recipe-head img { width:clamp(6rem,20vw,12rem); aspect-ratio:4/3; object-fit:cover; }
  .recipe-head img[hidden] { display:none; }
  #meta,#sources { color:var(--muted); font-size:.9rem; }
  #notice { border-left:3px solid var(--accent); padding-left:.75rem; color:#693624; }
  .columns { display:grid; grid-template-columns:1fr 1.6fr; gap:1.6rem; margin-top:1.5rem; }
  ul,ol { padding-left:1.3rem; }
  li { padding-left:.15rem; margin:.35rem 0; }
  #caption { white-space:pre-line; overflow-wrap:anywhere; }
  #sources { border-top:1px solid var(--rule); padding-top:.75rem; }
  a { color:var(--accent); text-underline-offset:.2em; }
  @media (max-width:34rem) { .entry,.columns { display:grid; grid-template-columns:1fr; } }
  @page { size:A4 portrait; margin:13mm; }
  @media print {
    body,article { background:white; color:#111; }
    main,article { margin:0; padding:0; max-width:none; border:0; }
    .screen { display:none !important; }
    .recipe-head { grid-template-columns:minmax(0,1fr) auto; break-inside:avoid; }
    .recipe-head img { width:42mm; max-height:31mm; }
    h2 { font-size:25pt; } h3 { font-size:15pt; break-after:avoid; }
    .columns { display:grid; grid-template-columns:1fr 1.6fr; gap:8mm; margin-top:4mm; }
    body,#meta,#sources { font-size:10pt; }
    li { break-inside:avoid; }
  }
</style>
</head>
<body>
<main>
  <header class="mast screen"><strong>Ricettario</strong><span>Archivio personale</span></header>
  <section class="screen">
    <h1>Dal link alla tavola.</h1>
    <p id="intro" class="intro">Incolla il link di un Reel o di un blog di cucina.</p>
    <form id="form">
      <label for="url">Link della ricetta</label>
      <div class="entry"><input id="url" type="url" placeholder="https://…" autocomplete="url" required><button id="import">Importa ricetta</button></div>
    </form>
    <a id="access" class="access" href="https://ricettario-elia.onrender.com/" hidden>Accedi al ricettario</a>
    <p id="status" role="status"></p>
  </section>
  <article id="recipe" hidden aria-labelledby="title">
    <header class="recipe-head">
      <div><h2 id="title"></h2><p id="meta"></p></div>
      <img id="photo" alt="" hidden>
    </header>
    <p id="notice" hidden></p>
    <div class="columns" id="columns">
      <section><h3>Ingredienti</h3><ul id="ingredients"></ul></section>
      <section><h3>Procedimento</h3><ol id="steps"></ol></section>
    </div>
    <p id="caption" hidden></p>
    <p id="sources"></p>
    <button class="screen" type="button" id="print">Stampa ricetta</button>
  </article>
</main>
<script>
  const byId = id => document.getElementById(id);
  const form = byId('form');
  const status = byId('status');
  const article = byId('recipe');
  const button = byId('import');
  const setList = (id, values) => {
    byId(id).replaceChildren(...(Array.isArray(values) ? values : []).map(value => {
      const li = document.createElement('li');
      li.textContent = String(value);
      return li;
    }));
  };
  function render(recipe) {
    byId('title').textContent = recipe.titolo || 'Ricetta importata';
    byId('meta').textContent = [recipe.author, recipe.porzioni && recipe.porzioni + ' porzioni',
      ...(typeof recipe.tempi === 'string' ? [recipe.tempi] :
        Object.entries(recipe.tempi || {}).filter(([, value]) => value).map(([key, value]) => key + ' · ' + value))
    ].filter(Boolean).join('  /  ');
    const photo = byId('photo');
    photo.hidden = !recipe.image;
    photo.removeAttribute('src');
    if (recipe.image) photo.src = recipe.image;
    const notes = [
      recipe.needs_confirmation && 'Ricetta trovata sul blog dell’autore. Verifica che corrisponda al Reel.',
      !recipe.translated && 'Anteprima nella lingua originale. Traduzione da configurare.',
    ].filter(Boolean);
    byId('notice').textContent = notes.join(' ');
    byId('notice').hidden = !notes.length;
    byId('caption').textContent = recipe.descrizione || '';
    byId('caption').hidden = !recipe.descrizione;
    byId('columns').hidden = Boolean(recipe.descrizione);
    setList('ingredients', recipe.ingredienti);
    setList('steps', recipe.passaggi);
    const sources = byId('sources');
    sources.replaceChildren('Fonti ');
    for (const [label, url] of [['Reel', recipe.reel], ['Blog', recipe.blog]]) {
      if (typeof url !== 'string' || !url.startsWith('https://')) continue;
      const a = document.createElement('a');
      a.href = url;
      a.textContent = label;
      sources.append('  ', a);
    }
    article.hidden = false;
  }
  const pagesPreview = window.location.hostname.endsWith('.github.io');
  if (pagesPreview) {
    form.hidden = true;
    byId('access').hidden = false;
    byId('intro').textContent = 'Accedi per importare una ricetta da un Reel o da un blog di cucina.';
  }
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (pagesPreview) return;
    button.disabled = true;
    status.textContent = 'Sto cercando la ricetta…';
    article.hidden = true;
    try {
      const response = await fetch('/api/import', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({url:byId('url').value.trim()}),
      });
      if (!response.headers.get('Content-Type')?.includes('application/json')) {
        throw new Error('Il servizio di importazione non risponde. Riprova più tardi.');
      }
      const recipe = await response.json();
      if (!response.ok) throw new Error(recipe.error);
      render(recipe);
      status.textContent = 'Ricetta importata.';
    } catch (error) {
      status.textContent = error instanceof SyntaxError || error instanceof TypeError
        ? 'Il servizio di importazione non è disponibile. Avvia il server locale.'
        : error.message;
    } finally {
      button.disabled = false;
    }
  });
  byId('photo').addEventListener('error', event => { event.target.hidden = true; });
  byId('print').addEventListener('click', () => window.print());
</script>
</body>
</html>
