services:
  - type: web
    name: ricettario-elia
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m py_compile importer.py serve.py archive_db.py
    startCommand: python serve.py
    healthCheckPath: /health
    envVars:
      - key: RICETTARIO_PASSWORD
        sync: false
